# Nexus Temp Workflow Protocol Contract Evolution

## Action

Follow the protocol-contract-evolution workflow:
1. Edit or add to the schema definition (JSON schema file).
2. Edit or add to the protocol documentation (PROTOCOL.md).
3. Update or implement Rust source files for the contract logic (src/v2.rs, canonicalization helpers, etc).
4. Update or add test files for the contract (tests/recall_envelope_v2*.rs).
5. Update test vectors (vectors/recall_envelope_v2/*.json).
6. Update the manifest hash (MANIFEST.sha256) to reflect artifact changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: crates/aeon_nexus_bridge/schema/recall_envelope_v2.schema.json, crates/aeon_nexus_bridge/schema/recall_envelope_v2/PROTOCOL.md, crates/aeon_nexus_bridge/src/v2.rs

